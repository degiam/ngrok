<iframe id="preview" class="fixed inset-0 z-1 size-full sr-only"></iframe>

<script>
	const TARGET = 'https://dimmed-script-flatly.ngrok-free.dev'

	async function checkUrl() {
		// Susun URL target: base + path + query + hash
		const targetUrl = TARGET + location.pathname + location.search + location.hash

		// 1. Cek dulu online/offline lewat Function
		try {
			const res = await fetch('/check')
			const data = await res.json()

			if (!data.online) {
				console.log('Target offline')
				return
			}
		} catch {
			console.log('Gagal mengakses URL')
			return
		}

		// 2. Set src iframe sesuai path address bar
		const iframe = document.getElementById('preview')
		iframe.src = targetUrl

		// 3. Tampilkan iframe, sembunyikan halaman offline
		document.querySelector('main').remove()
		iframe.classList.remove('sr-only')
	}

	checkUrl()
</script>
